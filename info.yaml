# Tiny Tapeout project information
project:
  title: "Setup/Hold Time Characterization" # Project title
  author: "Matthew Guthaus" # Your name
  discord: "mobius" # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description: "Setup/Hold time characterization using inverter delay chains with PLL-style tracking and serial output." # One line description of what your project does
  language: "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz: 50000000 # Clock frequency in Hz (50MHz for event counter)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1" # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module: "tt_um_mrg_setuphold"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

  # The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
  # This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs (ui_in[7:0] - Mode control)
  ui[0]: "" # Unused
  ui[1]: "" # Unused
  ui[2]: "" # Unused
  ui[3]: "" # Unused
  ui[4]: "" # Unused
  ui[5]: "" # Unused
  ui[6]: "" # Unused
  ui[7]: "MODE_SELECT" # Mode select: 0=setup/hold test, 1=ring oscillator

  # Outputs (uo_out[7:0] - Serial data and debug signals)
  uo[0]: "SERIAL_DATA" # Serial data output (MSB first)
  uo[1]: "SHIFT_VALID" # High during first valid shifted bit
  uo[2]: "SETUP_MISMATCH" # Setup time violation detected
  uo[3]: "HOLD_MISMATCH" # Hold time violation detected
  uo[4]: "SETUP_DFF_OUT" # Setup test flip-flop output
  uo[5]: "HOLD_DFF_OUT" # Hold test flip-flop output
  uo[6]: "CLK_RING_OUT" # Clock ring oscillator output (ring osc mode only)
  uo[7]: "DATA_RING_OUT" # Data ring oscillator output (ring osc mode only)

  # Bidirectional pins (uio[7:0] - Monitoring outputs)
  uio[0]: "INDEX_MON[0]" # Monitoring: setup_index[0] or clk_count[0]
  uio[1]: "INDEX_MON[1]" # Monitoring: setup_index[1] or clk_count[1]
  uio[2]: "INDEX_MON[2]" # Monitoring: setup_index[2] or clk_count[2]
  uio[3]: "INDEX_MON[3]" # Monitoring: setup_index[3] or clk_count[3]
  uio[4]: "INDEX_MON[4]" # Monitoring: setup_index[4] or clk_count[4]
  uio[5]: "INDEX_MON[5]" # Monitoring: setup_index[5] or clk_count[5]
  uio[6]: "INDEX_MON[6]" # Monitoring: setup_index[6] or clk_count[6]
  uio[7]: "INDEX_MON[7]" # Monitoring: setup_index[7] or clk_count[7]

  # Do not change!
yaml_version: 6
